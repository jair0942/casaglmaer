<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#f5f0e6" />
  <meta name="description" content="Glamel Collection — Edificio Galaxia local 111. Contáctanos por WhatsApp o Instagram." />
  <title>Glamel Collection</title>

  <link rel="icon" type="image/jpeg" href="/casa2/logo.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    /* Variante blanca — Glamel Collection */
    body {
      background:
        radial-gradient(ellipse at 20% 30%, rgba(255,255,255,0.5) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(255,255,255,0.3) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, #f5f0e6 0%, #ebe4d4 40%, #ddd4c0 100%);
    }
    .card { background: #ffffff; border-color: #d0c8b8; }
    .card__corner::before,
    .card__corner::after { background: #1a1611; }
    .contact__card { background: #f8f5ef; border-color: #e0d8c8; }
    .contact__icon { background: #e8e2d4; }
    .location { background: #f8f5ef; border-color: #e0d8c8; }
    .btn--light { background: #f0ebe0; border-color: #d0c8b8; }
    .hero__name { font-style: normal; }
  </style>
</head>
<body>
  <main class="card">
    <div class="card__corner" aria-hidden="true"></div>

    <header class="hero">
      <img class="hero__logo" src="/casa2/logo.jpg" alt="Glamel Collection — monograma GC" />
      <h1 class="hero__name">Glamel Collection</h1>
      <p class="hero__sub">GLAMOUR MODA Y ELEGANCIA</p>
    </header>

    <p class="tagline">EDIFICIO GALAXIA LOCAL 111</p>

    <section class="contact" aria-label="Contacto">
      <a class="contact__card" href="tel:+573046789120">
        <span class="contact__icon contact__icon--phone">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </span>
        <span class="contact__info">
          <span class="contact__label">TELÉFONO</span>
          <span class="contact__value">304 678 9120</span>
        </span>
      </a>
      <a class="contact__card" href="https://www.instagram.com/glamelcollection?stkn=MXNrMHd6YmpsajBndQ==" target="_blank" rel="noopener">
        <span class="contact__icon contact__icon--ig">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><circle cx="12" cy="12" r="4.5"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg>
        </span>
        <span class="contact__info">
          <span class="contact__label">INSTAGRAM</span>
          <span class="contact__value">@glamelcollection</span>
        </span>
      </a>
    </section>

    <section class="locations locations--single" aria-label="Ubicación">
      <a class="location" href="https://www.google.com/maps/search/?api=1&query=Edificio+Galaxia+Santa+Marta" target="_blank" rel="noopener">
        <svg class="location__pin" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span class="location__tag">UBICACIÓN</span>
        <strong class="location__name">Glamel Collection</strong>
        <p class="location__addr">Edificio Galaxia local 111</p>
      </a>
    </section>

    <nav class="actions" aria-label="Acciones">
      <a class="btn btn--dark" href="https://wa.me/573046789120" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.625.846 5.059 2.284 7.034L.789 23.492a.5.5 0 0 0 .627.616l4.584-1.18A11.952 11.952 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-2.319 0-4.478-.663-6.32-1.806l-.442-.282-2.708.699.724-2.643-.291-.46A9.953 9.953 0 0 1 2 12C2 6.486 6.486 2 12 2s10 4.486 10 10-4.486 10-10 10z"/></svg>
        <span>WHATSAPP</span>
        <span class="btn__arrow">→</span>
      </a>
      <a class="btn btn--light" href="https://www.instagram.com/glamelcollection?stkn=MXNrMHd6YmpsajBndQ==" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><circle cx="12" cy="12" r="4.5"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg>
        <span>INSTAGRAM</span>
        <span class="btn__arrow">→</span>
      </a>
    </nav>

    <footer class="footer">
      <span class="footer__line"></span>
      <span class="footer__diamond">◆</span>
      <span class="footer__line"></span>
    </footer>
    <p class="footer__text">GLAMEL COLLECTION</p>
  </main>

  <script src="/js/main.js" defer></script>
</body>
</html>
