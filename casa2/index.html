<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Glamel Collection — Edificio Galaxia local 111. Contáctanos por WhatsApp o Instagram." />
  <title>Glamel Collection</title>

  <link rel="icon" type="image/jpeg" href="/casa2/logo.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ==========================================================
       Glamel Collection — Casa2
       Fondo negro, esquinas curvas, contactos centrados
       ========================================================== */
    :root {
      --ink: #f5f0e6;
      --muted: #a89a84;
      --muted-light: #8a7d6b;
      --line: #c5a96e;
      --line-light: rgba(197, 169, 110, 0.3);
      --text-soft: #c0b8a8;
      --card-bg: #000000;
      --card-border: #c5a96e;
      --icon-bg: #0a0a0a;
      --btn-dark: #c5a96e;
      --btn-dark-text: #0d0d0d;
      --btn-light: transparent;
      --btn-light-border: #c5a96e;

      --font-serif: "Cormorant Garamond", Georgia, serif;
      --font-sans: "Montserrat", Arial, sans-serif;

      --card-width: min(92vw, 400px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      font-family: var(--font-sans);
      color: var(--ink);
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(ellipse at 50% 50%, #0a0a0a 0%, #000000 40%, #000000 100%);
    }

    /* ---- Tarjeta ---- */
    .card {
      width: var(--card-width);
      max-height: 94vh;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 20px;
      padding: 32px 26px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 32px rgba(80,60,30,0.12), 0 2px 8px rgba(80,60,30,0.08);
    }

    .card::-webkit-scrollbar { width: 3px; }
    .card::-webkit-scrollbar-track { background: transparent; }
    .card::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 3px; }

    /* ---- Hero / Logo ---- */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }

    .hero__logo {
      width: min(55vw, 190px);
      height: auto;
      margin-bottom: 10px;
      mix-blend-mode: screen;
    }

    /* ---- Tagline ---- */
    .tagline {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-family: var(--font-sans);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 3.5px;
      color: var(--muted);
      margin: 0 0 6px;
      white-space: nowrap;
      position: relative;
      z-index: 1;
      width: 100%;
    }

    .tagline::before,
    .tagline::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--line);
    }

    /* ---- Separador diamante ---- */
    .sep {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 60%;
      margin: 4px 0 14px;
      position: relative;
      z-index: 1;
    }

    .sep__line {
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .sep__diamond {
      font-size: 8px;
      color: var(--line);
      line-height: 1;
    }

    /* ---- Contacto ---- */
    .contact {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .contact__item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 10px 0 12px;
      border-bottom: 1px solid var(--line-light);
    }

    .contact__item:last-child {
      border-bottom: 1px solid var(--line-light);
    }

    .contact__icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1.5px solid var(--line);
      color: var(--ink);
      margin-bottom: 6px;
      background: var(--icon-bg);
    }

    .contact__label {
      font-family: var(--font-sans);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 4px;
      color: var(--muted-light);
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .contact__value {
      font-family: var(--font-serif);
      font-size: 26px;
      font-weight: 500;
      line-height: 1;
      color: var(--ink);
      text-decoration: none;
    }

    .contact__link {
      color: inherit;
      text-decoration: none;
    }

    /* ---- Ubicación ---- */
    .location {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 16px 20px;
      background: var(--card-bg);
      border: 1.5px solid var(--line);
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      width: 100%;
      margin-top: 14px;
      position: relative;
      z-index: 1;
    }

    .location:hover { background: #0a0a0a; }

    .location__pin {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1.5px solid var(--line);
      color: var(--ink);
      margin-bottom: 6px;
      background: var(--icon-bg);
    }

    .location__tag {
      font-family: var(--font-sans);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 3.5px;
      color: var(--muted-light);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .location__name {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 500;
      display: block;
      line-height: 1;
      margin-bottom: 3px;
    }

    .location__addr {
      font-family: var(--font-serif);
      font-size: 14px;
      color: var(--text-soft);
      line-height: 1.3;
    }

    /* ---- Botones ---- */
    .actions {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-top: 14px;
      position: relative;
      z-index: 1;
    }

    .btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 10px;
      text-decoration: none;
      font-family: var(--font-sans);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 2.5px;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.85; }
    .btn svg { flex-shrink: 0; }
    .btn__arrow { font-size: 13px; margin-left: 2px; }

    .btn--dark {
      background: var(--btn-dark);
      color: var(--btn-dark-text);
      border: 1.5px solid var(--btn-dark);
    }

    .btn--light {
      background: transparent;
      color: var(--ink);
      border: 1.5px solid var(--btn-light-border);
    }

    /* ---- Footer ---- */
    .footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 80%;
      margin-top: 14px;
      position: relative;
      z-index: 1;
    }

    .footer__lines {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin-bottom: 6px;
    }

    .footer__line {
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .footer__diamond {
      font-size: 8px;
      color: var(--line);
      line-height: 1;
    }

    .footer__text {
      font-family: var(--font-sans);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 5px;
      color: var(--muted-light);
    }

    /* ---- Responsive ---- */
    @media (max-height: 700px) {
      .card { padding: 22px 20px 14px; }
      .hero__logo { width: min(45vw, 150px); }
      .contact__icon { width: 38px; height: 38px; }
      .contact__value { font-size: 22px; }
      .location { padding: 12px 16px; }
      .location__name { font-size: 19px; }
    }
  </style>
</head>
<body>
  <main class="card">

    <header class="hero">
      <img class="hero__logo" src="/casa2/logo.jpg" alt="Glamel Collection — monograma GC" />
    </header>

    <p class="tagline">GLAMOUR MODA Y ELEGANCIA</p>

    <div class="sep" aria-hidden="true">
      <span class="sep__line"></span>
      <span class="sep__diamond">◆</span>
      <span class="sep__line"></span>
    </div>

    <section class="contact" aria-label="Contacto">
      <div class="contact__item">
        <span class="contact__icon">

        <span class="contact__icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><circle cx="12" cy="12" r="4.5"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg>

        <a class="contact__value contact__link" href="https://www.instagram.com/glamelcollection?stkn=MXNrMHd6YmpsajBndQ==" target="_blank" rel="noopener">@glamelcollection</a>
      </div>
    </section>

    <a class="location" href="https://www.google.com/maps/search/?api=1&query=Edificio+Galaxia+Santa+Marta" target="_blank" rel="noopener">
      <span class="location__pin">

      </span>

      <strong class="location__name">Glamel Collection</strong>

        <span>INSTAGRAM</span>
        <span class="btn__arrow">→</span>
      </a>
    </nav>

    <div class="footer">
      <div class="footer__lines">
        <span class="footer__line"></span>
        <span class="footer__diamond">◆</span>
        <span class="footer__line"></span>
      </div>
      <span class="footer__text">GLAMEL COLLECTION</span>
    </div>
  </main>

  <script src="/js/main.js" defer></script>
</body>
</html>
